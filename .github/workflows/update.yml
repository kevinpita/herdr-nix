name: Check for Updates

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to update (tui, core, app); empty checks all'
        required: false
      version:
        description: 'Specific version to update to (needs package)'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: tui
            name: herdr-tui
          - package: core
            name: herdr-core
          - package: app
            name: herdr
    steps:
      - uses: actions/checkout@v6.0.2
        if: github.event.inputs.package == '' || github.event.inputs.package == matrix.package
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v31.10.6
        if: github.event.inputs.package == '' || github.event.inputs.package == matrix.package
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - name: Check for new version
        id: check
        if: github.event.inputs.package == '' || github.event.inputs.package == matrix.package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_VERSION=$(./scripts/update.sh --package "${{ matrix.package }}" --current)
          echo "Current version: $CURRENT_VERSION"

          if [ -n "${{ github.event.inputs.version }}" ]; then
            LATEST_VERSION="${{ github.event.inputs.version }}"
          else
            LATEST_VERSION=$(./scripts/update.sh --package "${{ matrix.package }}" --latest || echo "")
          fi

          if [ -z "$LATEST_VERSION" ]; then
            echo "Could not fetch latest version"
            exit 0
          fi

          echo "Latest version: $LATEST_VERSION"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            echo "new_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version
        if: steps.check.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update.sh --package "${{ matrix.package }}" --version "${{ steps.check.outputs.new_version }}"

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update ${{ matrix.name }} to version ${{ steps.check.outputs.new_version }}"
          title: "chore: update ${{ matrix.name }} to version ${{ steps.check.outputs.new_version }}"
          body: |
            ## Update ${{ matrix.name }}

            This PR updates ${{ matrix.name }} from version ${{ steps.check.outputs.current_version }} to ${{ steps.check.outputs.new_version }}.

            ### Changes
            - Updated `version` in `packages/${{ matrix.name == 'herdr' && 'herdr-app' || matrix.name }}.nix`
            - Updated source, Cargo, and Zig dependency hashes
            - Updated `flake.lock`
            - Checked flake evaluation

            ---
            This PR was automatically generated by the update workflow.
          branch: update-${{ matrix.name }}-${{ steps.check.outputs.new_version }}
          delete-branch: true
          labels: |
            dependencies
            automated

      - name: Enable Auto-Merge
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash --delete-branch

      - name: Summary
        if: always() && steps.check.outcome == 'success'
        run: |
          {
            echo "## ${{ matrix.name }}"
            echo ""
            echo "- Current Version: ${{ steps.check.outputs.current_version }}"
            if [ "${{ steps.check.outputs.update_needed }}" = "true" ]; then
              echo "- Latest Version: ${{ steps.check.outputs.new_version }}"
              echo ""
              echo "Pull request created. Auto-merge was attempted when supported."
            else
              echo ""
              echo "Already up to date."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
