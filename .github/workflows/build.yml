name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - uses: cachix/cachix-action@v17
        with:
          name: kevinpita
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Evaluate all supported systems
        run: nix flake check --all-systems --no-build

      - name: Build herdr-core
        run: nix build .#herdr-core --print-build-logs -o result-core

      - name: Check herdr-core version
        run: ./result-core/bin/hc --version

      - name: Build herdr-tui
        run: nix build .#herdr-tui --print-build-logs -o result-tui

      - name: Check herdr-tui version
        run: ./result-tui/bin/herdr --version

      - name: Build herdr app
        run: nix build .#herdr --print-build-logs -o result-app

      - name: Verify herdr app contents
        run: |
          test -x ./result-app/bin/herdr-app
          test -f ./result-app/share/applications/herdr-app.desktop
